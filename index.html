<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16181d" />
    <title>ui_preview</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #16181d; }
      /* Inset the canvas to the device safe area so it never covers the notch,
         rounded corners, or home indicator. The body background fills those
         regions edge-to-edge while the canvas — and therefore all UI — stays
         inside the safe rect. On desktop the insets are 0 and it fills the
         viewport. 100dvh tracks the dynamic mobile viewport (URL bar shrink). */
      #app {
        display: block;
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        left: env(safe-area-inset-left, 0px);
        width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
        height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        touch-action: none;
      }
      #error {
        display: none; position: fixed; inset: 0; margin: auto; max-width: 640px; height: max-content;
        padding: 24px; font: 14px/1.6 ui-monospace, monospace; color: #ff8d8d; background: #1d2026;
        border: 1px solid #3a414d; border-radius: 8px; white-space: pre-wrap;
      }
      #nogpu {
        position: fixed; inset: 0; display: none; place-items: center; text-align: center;
        font: 15px/1.6 system-ui, sans-serif; color: #9aa3b0; padding: 32px;
      }
      #nogpu a { color: #4c8bf5; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <pre id="error"></pre>
    <div id="nogpu">
      <div>
        <h2 style="color:#e6e9ef">WebGPU is required</h2>
        <p>This preview renders entirely on the GPU. Open it in a WebGPU-capable
        browser (recent Chrome, Edge, or Safari Technology Preview).</p>
        <p><a href="https://caniuse.com/webgpu">Browser support →</a></p>
      </div>
    </div>
    <script type="module" src="./preview/ui_boot.ts"></script>
  </body>
</html>
